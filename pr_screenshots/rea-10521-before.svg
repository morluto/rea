  <text x="108" y="34" fill="#d1d5db" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="18">REA · decompile_all resume · BEFORE</text>
  <text x="48" y="104" fill="#fca5a5" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="28" font-weight="700">Append-only handle also used for repair</text>
  <text x="48" y="146" fill="#9ca3af" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="18">Source snapshot of the path reported in issue #10521</text>
  <text x="60" y="218" fill="#93c5fd" font-family="SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="24">const handle = await openJournal(root, "a");</text>
  <text x="60" y="258" fill="#d1d5db" font-family="SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="24">// O_WRONLY | O_APPEND</text>
  <text x="60" y="338" fill="#fbbf24" font-family="SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="24">await handle.value.truncate(committedBytes);</text>
  <rect x="48" y="380" width="1104" height="132" rx="10" fill="#3f1d2e" stroke="#be123c" stroke-width="2"/>
  <text x="72" y="422" fill="#fecdd3" font-family="SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="22">Windows: append-only descriptor cannot truncate</text>
  <text x="72" y="462" fill="#fda4af" font-family="SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="22">EPERM / FILE_APPEND_DATA lacks write-data access</text>
