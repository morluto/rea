name: Select Ubuntu package archive
description: Use the official HTTPS Ubuntu archive before resolving fixture toolchains.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        # Hosted Ubuntu runners can use Azure or regional EC2 mirrors.
        for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
          if [ -f "$source" ]; then
            sudo sed -Ei.bak 's|https?://([[:alnum:]-]+\.)*archive\.ubuntu\.com/|https://archive.ubuntu.com/|g' "$source"
          fi
        done
        # Three attempts, including kill grace and backoff, consume at most
        # 165 seconds. Fail even when APT could continue with stale indexes.
        for attempt in 1 2 3; do
          if sudo timeout --kill-after=5s 45s \
            apt-get -o Acquire::Retries=2 --error-on=any update; then
            exit 0
          else
            status=$?
            echo "Ubuntu archive update attempt ${attempt} failed (exit ${status})" >&2
          fi
          if [ "$attempt" -lt 3 ]; then
            sleep $((attempt * 5))
          fi
        done
        echo 'Ubuntu archive update failed after three bounded attempts' >&2
        exit 1
