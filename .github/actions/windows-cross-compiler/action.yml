name: Prepare MinGW x64 cross compiler
description: Install the POSIX MinGW x64 toolchain from the signed Ubuntu archive.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/ubuntu-archive
    - shell: bash
      run: |
        # The addon uses std::mutex. Install one threading model and select
        # it explicitly so preinstalled alternatives cannot choose another.
        sudo apt-get install --no-install-recommends -y g++-mingw-w64-x86-64-posix
        sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
        x86_64-w64-mingw32-g++ -v
