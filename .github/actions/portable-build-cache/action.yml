name: Portable build cache
description: Restore portable Turbo build outputs from the current run or cross-run cache.
inputs:
  save:
    description: Save newly built outputs after the job succeeds.
    default: "false"
  build_cache_artifact:
    description: Reuse portable Turbo outputs uploaded by the current workflow run.
    default: ""
runs:
  using: composite
  steps:
    - name: Download portable build outputs from this workflow run
      if: inputs.build_cache_artifact != ''
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: ${{ inputs.build_cache_artifact }}
        path: .turbo/cache/
    - name: Resolve portable build task hashes
      id: plan
      if: inputs.build_cache_artifact == ''
      shell: bash
      env:
        BUILD_CACHE_PREFIX: rea-portable-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.npmrc', '.nvmrc', 'package-lock.json') }}
      run: |
        node -p 'JSON.stringify(process.versions)' >&2
        printf 'Runner image: %s (%s)\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}" >&2
        if [[ -r /proc/sys/kernel/core_pattern ]]; then
          printf 'Core dump pattern: ' >&2
          cat /proc/sys/kernel/core_pattern >&2
          printf 'Core dump soft limit: ' >&2
          ulimit -c >&2
        fi
        # Keep both statuses before any other command overwrites PIPESTATUS.
        # Disable errexit only for the pipeline so diagnostics survive an abort.
        set +e
        npm run --silent test:prepare -- --dry=json |
          node scripts/ci/portable-build-cache.mjs key >> "$GITHUB_OUTPUT"
        statuses=("${PIPESTATUS[@]}")
        set -e
        printf 'Portable build plan exit statuses: producer=%s consumer=%s\n' "${statuses[0]}" "${statuses[1]}" >&2
        # Match pipefail: the rightmost failing command determines the result.
        if (( statuses[1] != 0 )); then
          exit "${statuses[1]}"
        fi
        exit "${statuses[0]}"
    - name: Restore portable build outputs
      if: inputs.build_cache_artifact == '' && inputs.save != 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .turbo/cache/
        key: ${{ steps.plan.outputs.key }}
        restore-keys: ${{ steps.plan.outputs.prefix }}
    - name: Restore and save portable build outputs
      if: inputs.build_cache_artifact == '' && inputs.save == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .turbo/cache/
        key: ${{ steps.plan.outputs.key }}
        restore-keys: ${{ steps.plan.outputs.prefix }}
