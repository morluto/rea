name: SQLite runtime compatibility

on:
  workflow_call:

permissions:
  contents: read

env:
  HUSKY: "0"

jobs:
  sqlite:
    name: SQLite runtime compatibility (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Exercise unavailable-runtime diagnostics and rolling supported releases.
        # Security floors prevent fallback to an older hosted-toolcache patch.
        # The repository-pinned Node 24 version also runs the complete test suite.
        node: ["^22.23.4", "24.22.1", "^24.22.1", "^26.12.1"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
      - name: Cache npm package downloads
        id: npm-cache
        uses: ./.github/actions/npm-cache
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rea-test-runtime
          path: .
      - name: Verify SQLite discovery, inspection and cleanup
        run: npm run test:sqlite:run
