name: Real website runtime attribution
on:
  workflow_call:
    inputs:
      build_cache_artifact:
        description: Portable build cache artifact from the calling CI run.
        required: false
        type: string
        default: ""
  workflow_dispatch:
permissions:
  contents: read
env:
  HUSKY: "0"
jobs:
  real-web-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/portable-build-cache
        with:
          build_cache_artifact: ${{ inputs.build_cache_artifact }}
      - run: npm run verify:browser:runtime
        env:
          REA_BROWSER_EXECUTABLE: /usr/bin/google-chrome
          REA_BROWSER_NO_SANDBOX: "true"
