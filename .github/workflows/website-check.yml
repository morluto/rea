name: Website checks

on:
  pull_request:
    branches: [main, "release/*"]
    paths:
      - "website/**"
      - "scripts/*website*.py"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Website checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - name: Set up Python for website assets and XML checks
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: website/requirements.txt
      - name: Install sharing-image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libcairo2 fonts-dejavu-core
          python3 -m pip install -r website/requirements.txt
      - name: Prepare website assets
        run: python3 scripts/prepare-website.py
      - name: Check website links, metadata and publishing configuration
        run: python3 scripts/verify-website.py
      - name: Check sitemap discovery and metadata regressions
        run: python3 scripts/test-website.py
