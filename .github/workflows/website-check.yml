name: Website checks

on:
  pull_request:
    branches: [main, "release/*"]
    paths:
      - "website/**"
      - "scripts/verify-website.py"
      - "scripts/prepare-website.py"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Website checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Prepare the example download
        run: python3 scripts/prepare-website.py
      - name: Check website links and publishing configuration
        run: python3 scripts/verify-website.py
