name: Website checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Website checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python for website assets
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: website/requirements.txt
      - name: Set up Node.js for skill discovery and Worker checks
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .nvmrc
      - name: Install website build dependencies
        run: |
          npm ci --omit=dev --ignore-scripts
          installed() {
            [[ "$(dpkg-query -W -f='${db:Status-Status}' "$1" 2>/dev/null)" == installed ]]
          }
          if ! installed libcairo2 || ! installed fonts-dejavu-core; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y libcairo2 fonts-dejavu-core
          fi
          python3 -m pip install -r website/requirements.txt
      - name: Check shared HTML, links, assets and contributor workflows
        run: python3 scripts/website.py check
