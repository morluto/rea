name: Build REA for Termux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.12.1

      - name: Install dependencies
        run: npm install --engine-strict=false

      - name: Build for Termux
        run: npm run build:termux

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: rea-termux-build
          path: |
            dist/
            artifacts/
          if-no-files-found: warn
