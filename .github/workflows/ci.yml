  required:
    name: CI required
    if: ${{ always() }}
    needs:
      [
        changes,
        static,
        build,
        test-shard,
        sqlite-runtime,
        test,
        conformance-fixtures,
        windows-native-build,
        package-e2e,
        apple-artifacts,
        reconstruction-readiness,
        windows-curated,
        docs,
        browser,
        binary_layout,
        evm,
        javascript_recovery,
        recorded_crash,
        web_network,
        web_runtime,
        web_source_map,
        nativeaot,
        website,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Require every selected lane to pass
        id: gate
        env:
          CI_JOBS: ${{ toJSON(needs) }}
          CI_QUALIFICATION_DIRECTORY: .cache/ci-qualification
        run: node scripts/ci/required.mjs
      - name: Upload full qualification receipt artifact
        if: needs.changes.outputs.tier == 'full' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.gate.outputs.receipt_name }}
          path: ${{ steps.gate.outputs.receipt_path }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7
