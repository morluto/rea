<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Across the process boundary</title>
  <rect width="1200" height="630" fill="#101923"/>
  <text x="65" y="93" fill="#83dfff" font-size="24" font-family="DejaVu Sans" font-weight="bold">REA   /   ELECTRON</text>
  <text x="65" y="179" fill="#e8f2f9" font-size="60" font-family="DejaVu Sans" font-weight="bold">Across the process boundary</text>
  <rect x="65" y="240" width="1070" height="290" rx="16" fill="#1d2b39"/>
  <text x="112" y="322" fill="#ff9753" font-size="29" font-family="DejaVu Sans" font-weight="normal">Renderer</text>
  <text x="430" y="322" fill="#4dd2ff" font-size="38" font-family="DejaVu Sans Mono" font-weight="normal">Request the CSV export</text>
  <text x="112" y="403" fill="#ff9753" font-size="29" font-family="DejaVu Sans" font-weight="normal">Preload</text>
  <text x="430" y="403" fill="#4dd2ff" font-size="38" font-family="DejaVu Sans Mono" font-weight="normal">Pass the IPC message</text>
  <text x="112" y="484" fill="#ff9753" font-size="29" font-family="DejaVu Sans" font-weight="normal">Main process</text>
  <text x="430" y="484" fill="#4dd2ff" font-size="38" font-family="DejaVu Sans Mono" font-weight="normal">Write the CSV file</text>
</svg>
