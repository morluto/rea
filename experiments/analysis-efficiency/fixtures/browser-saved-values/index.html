<!doctype html><meta charset="utf-8" /><title>
  PocketBase saved value verifier
</title>
<label>Email<input id="email" /></label
><label>Password<input type="password" id="password" /></label
><button id="login">Sign in</button><button id="create">Create record</button>
<pre id="result"></pre>
<script>
  document.querySelector("#login").onclick = async () => {
    const r = await fetch("/api/collections/_superusers/auth-with-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        identity: document.querySelector("#email").value,
        password: document.querySelector("#password").value,
      }),
    });
    const data = await r.json();
    localStorage.setItem("rea_auth", JSON.stringify(data));
    document.querySelector("#result").textContent = r.ok
      ? "Signed in"
      : "Sign in failed";
    if (r.ok) document.querySelector("#result").dataset.ready = "yes";
  };
  document.querySelector("#create").onclick = async () => {
    const token = JSON.parse(localStorage.getItem("rea_auth") || "{}").token;
    const r = await fetch("/api/collections/rea_items/records", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        ...(token ? { Authorization: token } : {}),
      },
      body: JSON.stringify({ title: "rea-ui-record" }),
    });
    document.querySelector("#result").textContent = JSON.stringify(
      await r.json(),
    );
  };
</script>
