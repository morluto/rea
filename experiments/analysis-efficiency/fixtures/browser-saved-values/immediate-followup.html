<!doctype html>
<meta charset="utf-8" />
<title>Immediate saved-response follow-up fixture</title>
<button id="run">Exchange and follow up</button>
<output id="result">pending</output>
<output id="sensitive"></output>
<script>
  document.querySelector("#run").onclick = async () => {
    const source = await (
      await fetch("/escaped-values.json", { cache: "no-store" })
    ).json();
    document.querySelector("#sensitive").textContent = source.token;
    console.log(source.token);
    const response = await fetch(
      "/api/collections/rea_items/records?token=" +
        encodeURIComponent(source.token),
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Followup": source.token,
        },
        body: JSON.stringify({ token: source.token }),
      },
    );
    const result = document.querySelector("#result");
    result.textContent = String(response.status);
    result.dataset.ready = "yes";
  };
</script>
